<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="chrome-template">
      <style>
        @font-face { font-family: "Sora"; font-weight: 300 700; src: url("assets/fonts/Sora-normal-300-700-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("assets/fonts/InstrumentSans-normal-400-700-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-normal-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-italic-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/fonts/IBMPlexMono-normal-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/IBMPlexMono-normal-500-latin.woff2") format("woff2"); }
        #ch-root {
          position: absolute;
          inset: 0;
          pointer-events: none;
          font-family: "Instrument Sans", "Helvetica Neue", sans-serif;
          color: #0e1a17;
        }
        #ch-head {
          position: absolute;
          left: 120px;
          top: 74px;
          width: 1200px;
          height: 150px;
        }
        .ch-label {
          position: absolute;
          left: 0;
          top: 0;
          display: flex;
          align-items: center;
          gap: 14px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 24px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #117d67;
          white-space: nowrap;
        }
        .ch-label i {
          display: block;
          width: 12px;
          height: 12px;
          border-radius: 3px;
          background: #117d67;
          transform: rotate(45deg);
        }
        .ch-title {
          position: absolute;
          left: 0;
          top: 46px;
          font-family: "Sora", sans-serif;
          font-weight: 600;
          font-size: 64px;
          letter-spacing: -0.035em;
          line-height: 1.05;
          color: #0e1a17;
          white-space: nowrap;
        }
        #ch-steps {
          position: absolute;
          right: 120px;
          top: 82px;
          display: flex;
          align-items: center;
          gap: 18px;
          font-size: 25px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        .ch-step {
          position: relative;
          color: #6f7a76;
          padding-bottom: 10px;
        }
        .ch-step-fill {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 4px;
          border-radius: 4px;
          background: #117d67;
          transform-origin: 0 50%;
        }
        .ch-sep {
          display: block;
          width: 28px;
          height: 2px;
          background: #d5dbd6;
          margin-bottom: 10px;
        }
        #ch-fict {
          position: absolute;
          right: 120px;
          top: 146px;
          padding: 8px 16px;
          border-radius: 10px;
          background: #eceeeb;
          border: 2px solid #e1e5e0;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 20px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #4e5a56;
          white-space: nowrap;
        }
      </style>

      <div id="ch-root" data-composition-id="chrome" data-width="1920" data-height="1080" data-duration="46">
        <div id="ch-wrap">
          <div id="ch-head">
            <div class="ch-label" id="ch-l1"><i></i>01 — Mesurer</div>
            <div class="ch-label" id="ch-l2"><i></i>02 — Comprendre</div>
            <div class="ch-label" id="ch-l3"><i></i>03 — Vérifier</div>
            <div class="ch-label" id="ch-l4"><i></i>04 — Agir</div>
            <div class="ch-title" id="ch-t1">Visibilité, classement et part de voix</div>
            <div class="ch-title" id="ch-t2">Ce qui influence les réponses</div>
            <div class="ch-title" id="ch-t3">Réputation IA</div>
            <div class="ch-title" id="ch-t4">Votre site est-il prêt pour les IA&nbsp;?</div>
            <div class="ch-title" id="ch-t5">Des priorités d'action concrètes</div>
          </div>
          <div id="ch-steps">
            <span class="ch-step" id="ch-s1">Mesurer<span class="ch-step-fill"></span></span><span class="ch-sep"></span>
            <span class="ch-step" id="ch-s2">Comprendre<span class="ch-step-fill"></span></span><span class="ch-sep"></span>
            <span class="ch-step" id="ch-s3">Vérifier<span class="ch-step-fill"></span></span><span class="ch-sep"></span>
            <span class="ch-step" id="ch-s4">Agir<span class="ch-step-fill"></span></span>
          </div>
          <div id="ch-fict">Exemple fictif · chaussures de running</div>
        </div>
      </div>

      <script>
        (function () {
          const LM = window.LM;
          const root = document.getElementById("ch-root");
          const tl = gsap.timeline({ paused: true });
          const T = [0, 11.25, 20.0, 30.0, 38.75, 46];
          const titles = [1, 2, 3, 4, 5].map(function (i) { return LM.splitWords(root.querySelector("#ch-t" + i)); });
          /* chapter of each title: 1 mesurer, 2-3 comprendre, 4 vérifier, 5 agir */
          const chap = [1, 2, 2, 3, 4];
          const labels = [1, 2, 3, 4].map(function (i) { return root.querySelector("#ch-l" + i); });
          const fills = [1, 2, 3, 4].map(function (i) { return root.querySelector("#ch-s" + i + " .ch-step-fill"); });
          const steps = [1, 2, 3, 4].map(function (i) { return root.querySelector("#ch-s" + i); });

          /* whole chrome fades in from the dark reveal and out before the final iris */
          tl.fromTo("#ch-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.25);
          tl.fromTo("#ch-wrap", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 45.35);

          labels.forEach(function (l) { gsap.set(l, { opacity: 0 }); });
          fills.forEach(function (f) { gsap.set(f, { scaleX: 0 }); });

          titles.forEach(function (words, i) {
            const tIn = i === 0 ? 0.35 : T[i] + 0.3;
            LM.focusIn(tl, words, tIn, { stagger: 0.05, blur: 14, y: 14, duration: 0.6 });
            if (i < 4) LM.focusOut(tl, words, T[i + 1] - 0.05, { stagger: 0.015, duration: 0.35 });
          });

          let prev = 0;
          chap.forEach(function (c, i) {
            if (c === prev) return;
            const tIn = i === 0 ? 0.3 : T[i] + 0.2;
            const lab = labels[c - 1];
            tl.fromTo(lab, { opacity: 0, x: -16, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, tIn);
            tl.fromTo(steps[c - 1], { color: "#6f7a76" }, { color: "#0e1a17", duration: 0.4 }, tIn);
            tl.fromTo(fills[c - 1], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, tIn + 0.1);
            if (prev) {
              const old = labels[prev - 1];
              tl.fromTo(old, { opacity: 1, x: 0, filter: "blur(0px)" }, { opacity: 0, x: 16, filter: "blur(8px)", duration: 0.35, ease: "power2.in", immediateRender: false }, T[i] - 0.05);
              tl.fromTo(steps[prev - 1], { color: "#0e1a17" }, { color: "#4e5a56", duration: 0.4, immediateRender: false }, T[i]);
            }
            prev = c;
          });
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
