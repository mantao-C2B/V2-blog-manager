<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="e-sources-template">
      <style>
        @font-face { font-family: "Sora"; font-weight: 300 700; src: url("assets/fonts/Sora-normal-300-700-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("assets/fonts/InstrumentSans-normal-400-700-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-normal-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-italic-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/fonts/IBMPlexMono-normal-400-latin.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/IBMPlexMono-normal-500-latin.woff2") format("woff2"); }
        #e-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Instrument Sans", "Helvetica Neue", sans-serif;
          color: #0e1a17;
        }
        #e-world {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          transform-origin: 960px 620px;
        }
        #e-links {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
        }
        #e-core {
          position: absolute;
          left: 690px;
          top: 486px;
          width: 540px;
          height: 250px;
          padding: 30px 36px;
          border-radius: 30px;
          color: #ffffff;
          background:
            radial-gradient(90% 140% at 100% 100%, rgba(63, 127, 118, 0.9) 0%, rgba(63, 127, 118, 0) 70%),
            #15223a;
          box-shadow: 0 40px 90px rgba(21, 34, 58, 0.35), 0 8px 24px rgba(14, 26, 23, 0.1);
        }
        #e-core-head {
          display: flex;
          align-items: center;
          gap: 14px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 22px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #2ebe9b;
        }
        #e-core-head .lm-icon {
          width: 28px;
          height: 28px;
        }
        #e-core-txt {
          margin-top: 18px;
          font-size: 30px;
          line-height: 1.35;
          letter-spacing: -0.01em;
          color: rgba(255, 255, 255, 0.92);
        }
        .e-b {
          display: inline-block;
          padding: 2px 12px;
          margin: 0 2px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.1);
          font-weight: 600;
          color: #ffffff;
        }
        .e-b.you {
          background: rgba(46, 190, 155, 0.22);
          color: #2ebe9b;
        }
        .e-src {
          position: absolute;
          width: 410px;
          height: 112px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 0 22px;
          border-radius: 24px;
          background: #ffffff;
          border: 2px solid #e1e5e0;
          box-shadow: 0 26px 60px rgba(14, 26, 23, 0.1), 0 4px 12px rgba(14, 26, 23, 0.04);
          transform-origin: 50% 50%;
        }
        .e-src .e-ico {
          width: 64px;
          height: 64px;
          flex: none;
          border-radius: 18px;
          background: #e4f3ee;
          color: #117d67;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .e-src .e-ico .lm-icon {
          width: 34px;
          height: 34px;
        }
        .e-src .e-nm {
          font-size: 29px;
          font-weight: 600;
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .e-src .e-dom {
          font-family: "IBM Plex Mono", monospace;
          font-size: 19px;
          color: #626c68;
          white-space: nowrap;
        }
        .e-w {
          position: absolute;
          right: -18px;
          top: -20px;
          padding: 6px 14px;
          border-radius: 999px;
          background: #117d67;
          color: #ffffff;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 22px;
          box-shadow: 0 10px 24px rgba(17, 125, 103, 0.35);
          white-space: nowrap;
        }
        .e-w.low {
          background: #eceeeb;
          color: #4e5a56;
          box-shadow: none;
        }
      </style>

      <div id="e-root" data-composition-id="e-sources" data-width="1920" data-height="1080" data-duration="9.45">
        <div id="e-world">
          <svg id="e-links" viewBox="0 0 1920 1080"></svg>
          <div id="e-srcs"></div>
          <div id="e-core">
            <div id="e-core-head"><span class="lm-icon" data-icon="sparkles"></span>Réponse IA</div>
            <div id="e-core-txt">Pour débuter, les modèles les plus cités sont <span class="e-b">Stridea</span>, <span class="e-b you">Kairun</span> et <span class="e-b">Velka</span>.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const LM = window.LM;
          const root = document.getElementById("e-root");
          root.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = LM.icon(el.getAttribute("data-icon"), { strokeWidth: 2.4 }); });

          /* sources: centre position, anchor on the core card, influence share */
          const SRC = [
            { n: "Sites experts", d: "test-chaussures.pro", ic: "award", x: 1480, y: 360, ax: 1230, ay: 560, w: 34, top: true },
            { n: "Avis consommateurs", d: "avis · forums", ic: "messages-square", x: 420, y: 790, ax: 690, ay: 660, w: 27, top: true },
            { n: "Presse", d: "runners-mag.fr", ic: "newspaper", x: 440, y: 360, ax: 690, ay: 560, w: 14 },
            { n: "E-commerce", d: "boutique-running.com", ic: "shopping-bag", x: 1500, y: 790, ax: 1230, ay: 660, w: 18 },
            { n: "Site de marque", d: "kairun.fr", ic: "globe", x: 960, y: 880, ax: 960, ay: 736, w: 7 },
          ];
          const ORDER = [2, 0, 1, 3, 4]; /* connect: presse, experts, avis, e-commerce, site de marque */
          const svg = root.querySelector("#e-links");
          const NS = "http://www.w3.org/2000/svg";
          const wrap = root.querySelector("#e-srcs");

          function bez(p0, p1, p2, p3, t) {
            const u = 1 - t;
            return [
              u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
            ];
          }

          SRC.forEach(function (s) {
            const card = document.createElement("div");
            card.className = "e-src";
            card.style.left = s.x - 205 + "px";
            card.style.top = s.y - 56 + "px";
            card.innerHTML = '<span class="e-ico"><span class="lm-icon">' + LM.icon(s.ic, { strokeWidth: 2.2 }) + "</span></span>" +
              '<span><span class="e-nm" style="display:block">' + s.n + '</span><span class="e-dom">' + s.d + "</span></span>" +
              '<span class="e-w' + (s.top ? "" : " low") + '">' + s.w + " %</span>";
            wrap.appendChild(card);
            s.card = card;
            /* curve from the source edge to the core anchor */
            const sx = s.x < 960 ? s.x + 205 : s.x > 960 ? s.x - 205 : s.x;
            const sy = s.x === 960 ? s.y - 56 : s.y;
            const p0 = [sx, sy], p3 = [s.ax, s.ay];
            const mx = (p0[0] + p3[0]) / 2;
            const p1 = s.x === 960 ? [sx, sy - 40] : [mx, p0[1]];
            const p2 = s.x === 960 ? [s.ax, s.ay + 40] : [mx, p3[1]];
            s.pts = [p0, p1, p2, p3];
            let L = 0, prev = p0;
            for (let i = 1; i <= 40; i++) { const q = bez(p0, p1, p2, p3, i / 40); L += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; }
            s.len = L;
            const path = document.createElementNS(NS, "path");
            path.setAttribute("d", "M" + p0[0] + " " + p0[1] + " C " + p1[0] + " " + p1[1] + ", " + p2[0] + " " + p2[1] + ", " + p3[0] + " " + p3[1]);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#117d67");
            path.setAttribute("stroke-width", "4");
            path.setAttribute("stroke-linecap", "round");
            svg.appendChild(path);
            s.path = path;
            const dot = document.createElementNS(NS, "circle");
            dot.setAttribute("r", "9");
            dot.setAttribute("fill", "#2ebe9b");
            dot.setAttribute("stroke", "#ffffff");
            dot.setAttribute("stroke-width", "3");
            dot.setAttribute("cx", p0[0]);
            dot.setAttribute("cy", p0[1]);
            dot.style.opacity = "0";
            svg.appendChild(dot);
            s.dot = dot;
          });

          const tl = gsap.timeline({ paused: true });

          /* the answer takes the centre */
          tl.fromTo("#e-world", { scale: 0.97 }, { scale: 1.04, duration: 9.4, ease: "sine.inOut" }, 0);
          tl.fromTo("#e-core", { opacity: 0, scale: 0.85, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.55);
          tl.fromTo("#e-core-txt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 }, 0.95);
          tl.fromTo("#e-core .e-b", { scale: 1, backgroundColor: "rgba(255,255,255,0.1)" }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.18 }, 1.7);

          /* sources connect one by one; data pulses flow into the answer */
          ORDER.forEach(function (idx, k) {
            const s = SRC[idx];
            const t = 2.4 + k * 0.42;
            tl.fromTo(s.card, { opacity: 0, scale: 0.8, y: 20, filter: "blur(8px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.6)" }, t);
            s.path.style.strokeDasharray = s.len + " " + s.len;
            tl.fromTo(s.path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t + 0.2);
            tl.fromTo(s.path, { strokeDashoffset: s.len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, t + 0.2);
            /* finite pulses along the curve (seek-safe: position is a pure function of the proxy) */
            const n = 4;
            for (let j = 0; j < n; j++) {
              const pr = { t: 0 };
              const t0 = t + 0.75 + j * 1.15 + k * 0.05;
              tl.fromTo(pr, { t: 0 }, { t: 1, duration: 0.95, ease: "power1.inOut", onUpdate: function () {
                const q = bez(s.pts[0], s.pts[1], s.pts[2], s.pts[3], pr.t);
                s.dot.setAttribute("cx", q[0]);
                s.dot.setAttribute("cy", q[1]);
                s.dot.style.opacity = pr.t <= 0 || pr.t >= 1 ? "0" : String(Math.min(1, pr.t * 6, (1 - pr.t) * 6));
              } }, t0);
            }
          });

          /* 5.6 — the most influential sources stand out; the others recede */
          const tEm = 5.6;
          SRC.forEach(function (s) {
            if (s.top) {
              tl.fromTo(s.card, { scale: 1, borderColor: "#e1e5e0" }, { scale: 1.14, borderColor: "#117d67", duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, tEm);
              tl.fromTo(s.path, { attr: { "stroke-width": 4 } }, { attr: { "stroke-width": 8 }, duration: 0.5, ease: "power2.out" }, tEm);
            } else {
              tl.fromTo(s.card, { opacity: 1, scale: 1 }, { opacity: 0.45, scale: 0.94, duration: 0.6, ease: "power2.out", immediateRender: false }, tEm);
              tl.fromTo(s.path, { opacity: 1 }, { opacity: 0.25, duration: 0.6, immediateRender: false }, tEm);
            }
            tl.fromTo(s.card.querySelector(".e-w"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, tEm + (s.top ? 0.25 : 0.45));
          });

          window.__timelines["e-sources"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
