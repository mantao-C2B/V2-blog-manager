<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LLM Monitor — outro logo 9:16</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sora"; font-style: normal; font-weight: 300 700; src: url("assets/fonts/Sora-normal-300-700-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Sora"; font-style: normal; font-weight: 300 700; src: url("assets/fonts/Sora-normal-300-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: "Sora", sans-serif; }
      /* Geometry measured on the supplied logo (2000x1125), scaled to 1920x1080. */
      /* The 16:9 lockup (1920x1080 stage) scaled to 85 % and centred, slightly above the middle. */
      #stage { position: absolute; left: -420px; top: 363px; width: 1920px; height: 1080px; transform: scale(0.85); transform-origin: 50% 50%; }
      #lockup { position: absolute; inset: 0; }
      #sym { position: absolute; left: 757.5px; top: 184.5px; width: 405px; height: 405px; }
      #sym svg { display: block; width: 100%; height: 100%; }
      .line { position: absolute; left: 0; right: 0; display: flex; justify-content: center; white-space: nowrap; color: #0e1a17; }
      #word { top: var(--word-top); font-weight: 600; font-size: var(--word-size); letter-spacing: -0.035em; line-height: 1.2; overflow: hidden; }
      #tag { top: var(--tag-top); font-weight: 300; font-size: var(--tag-size); letter-spacing: 0.005em; line-height: 1.3; }
      .ch { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.067" data-width="1080" data-height="1920" data-fps="30"
         style="--word-size: 167px; --word-top: 637px; --tag-size: 63px; --tag-top: 833px">
      <div id="stage" data-layout-allow-overflow>
      <div id="lockup">
        <div id="sym"></div>
        <div id="word" class="line">LLM Monitor</div>
        <div id="tag" class="line">By MarketConnect</div>
      </div>
      </div>
      <audio id="outro-sfx" src="assets/sfx.wav" data-start="0" data-duration="6.067" data-track-index="1" data-volume="1"></audio>
    </div>
    <script src="assets/kit.js"></script>
    <script>
      (function () {
        const LM = window.LM;
        document.getElementById("sym").innerHTML = LM.symbol({ color: "#117d67", size: 405 });
        const svg = document.querySelector("#sym svg");
        function chars(el) {
          const text = el.textContent;
          el.textContent = "";
          return Array.from(text).map(function (c) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c;
            el.appendChild(s);
            return s;
          });
        }
        const word = chars(document.getElementById("word"));
        const tag = chars(document.getElementById("tag"));
        const tl = gsap.timeline({ paused: true });

        // Symbol: official "tracé" draw on the impact SFX, then one quarter turn and a breath of the pupil.
        tl.fromTo("#sym", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" }, 0);
        LM.symbolDraw(tl, svg, 0, { duration: 0.9 });
        LM.symbolQuarter(tl, svg, 1.05, 1);
        LM.symbolPulse(tl, svg, 2.3, 2, 1.4);

        // Wordmark: letters rise out of a mask, one after the other.
        tl.fromTo(word, { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "power4.out", stagger: 0.035 }, 0.6);

        // Signature: settles in with the chime.
        const mid = (tag.length - 1) / 2;
        tag.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0, x: (i - mid) * 14, filter: "blur(8px)" },
            { opacity: 1, x: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, 1.3);
        });

        // Whole lockup: a very slow push for life.
        tl.fromTo("#lockup", { scale: 1 }, { scale: 1.025, duration: 4.4, ease: "sine.inOut", transformOrigin: "50% 48%" }, 1.6);

        tl.set({}, {}, 6.067);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
