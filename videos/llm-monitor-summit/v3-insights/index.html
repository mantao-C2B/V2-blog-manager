/* LLM Monitor @ SEO & GEO Summit — overlay styles (inlined into index.html by build.py).
   Brand: frame.md of ../llm-monitor-promo (mint only on dark, green on light, Sora titles,
   Instrument Serif display, Instrument Sans text, IBM Plex Mono labels). */
:root {
  --ink: #0e1a17;
  --green: #117d67;
  --mint: #2ebe9b;
  --white: #ffffff;
  --sable: #eceeeb;
  --canvas: #f5f6f3;
  --line: #e1e5e0;
  --ink-soft: #4e5a56;
  --ink-faint: #626c68;
  --mint-soft: #e4f3ee;
  --navy-900: #15223a;
  --navy-800: #1e3149;
  --teal-600: #3f7f76;
  --glass: rgba(21, 34, 58, 0.86);
  --font-display: "Instrument Serif", Georgia, serif;
  --font-title: "Sora", "Helvetica Neue", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", sans-serif;
  --font-data: "IBM Plex Mono", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--navy-900); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--navy-900); font-family: var(--font-body); }
.shot { position: absolute; inset: 0; overflow: hidden; }
.shot .inner { position: absolute; inset: 0; }
.shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#overlays, #captions { position: absolute; inset: 0; pointer-events: none; }
.ov { position: absolute; inset: 0; }
.flash { position: absolute; inset: 0; background: #f4fbf8; }
.dip { position: absolute; inset: 0; background: var(--navy-900); }
.shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(10, 18, 32, 0.55) 0%, rgba(10, 18, 32, 0.82) 100%); }
.shade.side { background: linear-gradient(90deg, rgba(10, 18, 32, 0.8) 0%, rgba(10, 18, 32, 0.25) 60%, rgba(10, 18, 32, 0) 100%); }
.w { display: inline-block; }
.hl { color: var(--mint); }

/* brand bug */
.bug { inset: auto; top: var(--m); right: var(--m); display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 999px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); }
.bug-sym { display: block; width: 46px; height: 46px; }
.bug-txt { font-family: var(--font-data); font-weight: 500; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); white-space: nowrap; }

/* headline */
.headline .hl-wrap { position: absolute; inset: 0; padding: 0 var(--m); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.headline .hl-wrap.center { align-items: center; text-align: center; }
.headline .hl-wrap.left { align-items: flex-start; text-align: left; }
.hl-kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-family: var(--font-data); font-weight: 500; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--white); }
.hl-kicker svg { width: 40px; height: 40px; }
.hl-line { color: var(--white); line-height: 1.02; }
.hl-line.sora { font-family: var(--font-title); font-weight: 700; font-size: var(--hl-size); letter-spacing: -0.04em; }
.hl-line.serif { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: calc(var(--hl-size) * 1.05); letter-spacing: -0.01em; }
.hl-line.mono { font-family: var(--font-data); font-weight: 600; font-size: calc(var(--hl-size) * 0.42); letter-spacing: 0.1em; text-transform: uppercase; }
.hl-line.big { font-family: var(--font-title); font-weight: 700; font-size: calc(var(--hl-size) * 1.45); letter-spacing: -0.05em; }
.hl-sub { margin-top: 18px; font-family: var(--font-data); font-weight: 500; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.86); }

/* lower third */
.lower { inset: auto; left: var(--m); bottom: var(--lt-bottom); }
.lower.right { left: auto; right: var(--m); }
.lt-card { position: relative; display: flex; align-items: center; gap: 22px; padding: 22px 34px 26px 22px; border-radius: 22px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); box-shadow: 0 30px 70px rgba(5, 12, 24, 0.35); }
.lt-sym { width: 64px; height: 64px; flex: none; }
.lt-sym svg { display: block; }
.lt-name { font-family: var(--font-title); font-weight: 600; font-size: 44px; letter-spacing: -0.03em; color: var(--white); line-height: 1.05; white-space: nowrap; }
.lt-role { margin-top: 8px; font-family: var(--font-data); font-weight: 500; font-size: 22px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--mint); white-space: nowrap; }
.lt-bar { position: absolute; left: 22px; right: 22px; bottom: 0; height: 4px; border-radius: 2px; background: var(--mint); }

/* location */
.location { inset: auto; left: var(--m); top: var(--m); display: flex; align-items: center; gap: 18px; }
.loc-pin { width: 64px; height: 64px; border-radius: 50%; background: var(--mint); padding: 13px; flex: none; }
.loc-pin svg { width: 100%; height: 100%; display: block; }
.loc-txt { padding: 12px 24px 14px; border-radius: 16px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); }
.loc-place { font-family: var(--font-title); font-weight: 600; font-size: 34px; letter-spacing: -0.03em; color: var(--white); white-space: nowrap; }
.loc-detail { margin-top: 4px; font-family: var(--font-data); font-weight: 500; font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.82); white-space: nowrap; }

/* chapter */
.ch-panel { position: absolute; left: 0; top: 0; bottom: 0; width: var(--ch-w); padding: 0 var(--m); display: flex; flex-direction: column; justify-content: center; background: linear-gradient(90deg, rgba(21, 34, 58, 0.95) 0%, rgba(21, 34, 58, 0.88) 70%, rgba(21, 34, 58, 0.0) 100%); }
.ch-line { position: absolute; left: calc(var(--m) - 28px); top: 32%; bottom: 32%; width: 5px; border-radius: 3px; background: var(--mint); }
.ch-num { font-family: var(--font-data); font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: var(--mint); }
.ch-title { margin-top: 10px; font-family: var(--font-display); font-style: italic; font-size: var(--ch-size); line-height: 0.98; color: var(--white); }
.ch-kicker { margin-top: 18px; font-family: var(--font-data); font-weight: 500; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.82); }

/* AI logos */
.logos { inset: auto; left: 0; right: 0; top: var(--logos-top); display: flex; justify-content: center; }
.logos.side { left: auto; right: var(--m); top: var(--m); justify-content: flex-end; }
.lg-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 2 * var(--m)); }
.lg-chip { display: flex; align-items: center; gap: 14px; padding: 12px 24px 12px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.96); box-shadow: 0 18px 40px rgba(5, 12, 24, 0.3); }
.lg-ico { width: 46px; height: 46px; display: block; }
.lg-ico svg { width: 100%; height: 100%; display: block; }
.lg-name { font-family: var(--font-title); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }

/* counter */
.counter { inset: auto; right: var(--m); top: var(--ct-top); }
.counter.left { right: auto; left: var(--m); }
.counter.center { right: 0; left: 0; display: flex; justify-content: center; }
.ct-card { padding: 30px 40px 34px; border-radius: 28px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); box-shadow: 0 40px 90px rgba(5, 12, 24, 0.35); }
.ct-label { font-family: var(--font-data); font-weight: 500; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mint); }
.ct-num { margin-top: 6px; font-family: var(--font-title); font-weight: 700; font-size: var(--ct-size); letter-spacing: -0.045em; line-height: 1; color: var(--white); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ct-txt { margin-top: 10px; font-family: var(--font-body); font-weight: 600; font-size: 32px; color: rgba(255, 255, 255, 0.92); max-width: 560px; line-height: 1.2; }

/* stat (product world) */
.stat { display: flex; align-items: center; justify-content: flex-end; padding: 0 var(--m); }
.stat.left { justify-content: flex-start; }
.stat.bottom { align-items: flex-end; justify-content: stretch; padding-bottom: var(--st-bottom); }
.stat .st-card { position: relative; width: var(--st-w); padding: 40px 46px 44px; border-radius: 28px; background: var(--white); border: 2px solid var(--line); box-shadow: 0 40px 90px rgba(5, 12, 24, 0.4); }
.stat.bottom .st-card { width: 100%; }
.st-label { display: flex; align-items: center; gap: 12px; font-family: var(--font-data); font-weight: 500; font-size: 21px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.st-label .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
.st-num { margin-top: 10px; font-family: var(--font-title); font-weight: 700; font-size: var(--st-size); letter-spacing: -0.05em; line-height: 0.95; color: var(--green); white-space: nowrap; }
.st-txt { margin-top: 12px; font-family: var(--font-body); font-weight: 600; font-size: 34px; line-height: 1.22; color: var(--ink); }
.st-rule { margin: 24px 0 18px; height: 3px; background: var(--line); }
.st-foot { font-family: var(--font-display); font-style: italic; font-size: 40px; line-height: 1.12; color: var(--ink); }
.st-foot b { font-style: normal; font-family: var(--font-title); font-weight: 700; color: var(--green); letter-spacing: -0.03em; }

/* chips */
.chips { display: flex; align-items: center; justify-content: center; padding: 0 var(--m); }
.chips .cp-card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.cp-label { font-family: var(--font-data); font-weight: 600; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mint); }
.cp-title { margin-top: 16px; font-family: var(--font-display); font-style: italic; font-size: var(--cp-size); line-height: 1.04; color: var(--white); max-width: 1500px; }
.cp-row { margin-top: 38px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 1500px; }
.cp-chip { display: flex; align-items: center; gap: 14px; padding: 16px 28px 16px 20px; border-radius: 999px; background: var(--glass); border: 2px solid rgba(46, 190, 155, 0.6); font-family: var(--font-title); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; color: var(--white); }
.cp-chip svg { width: 36px; height: 36px; flex: none; }

/* quote */
.quote { display: flex; align-items: center; justify-content: center; padding: 0 var(--m); }
.quote .qt-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.qt-mark { font-family: var(--font-display); font-size: 150px; line-height: 0.6; color: var(--mint); height: 80px; }
.qt-txt { margin-top: 12px; font-family: var(--font-display); font-style: italic; font-size: var(--qt-size); line-height: 1.08; color: var(--white); max-width: 1500px; }
.qt-by { margin-top: 26px; font-family: var(--font-data); font-weight: 500; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); }

/* talk title */
.talk { display: flex; align-items: center; justify-content: flex-start; padding: 0 var(--m); }
.talk.bottom { align-items: flex-end; padding-bottom: var(--st-bottom); }
.talk .tk-card { position: relative; width: var(--tk-w); padding: 36px 44px 40px; border-radius: 28px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); box-shadow: 0 40px 90px rgba(5, 12, 24, 0.35); }
.talk.bottom .tk-card { width: 100%; }
.tk-label { font-family: var(--font-data); font-weight: 600; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mint); }
.tk-title { margin-top: 14px; font-family: var(--font-title); font-weight: 700; font-size: var(--tk-size); letter-spacing: -0.04em; line-height: 1.02; color: var(--white); }
.tk-sub { margin-top: 16px; font-family: var(--font-display); font-style: italic; font-size: 38px; line-height: 1.12; color: rgba(255, 255, 255, 0.92); }
.tk-by { margin-top: 20px; font-family: var(--font-data); font-weight: 500; font-size: 21px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.8); }

/* callout */
.callout { inset: auto; right: var(--m); top: var(--co-top); }
.callout.left { right: auto; left: var(--m); }
.co-card { display: flex; align-items: center; gap: 16px; padding: 14px 28px 14px 14px; border-radius: 999px; background: var(--glass); border: 2px solid rgba(255, 255, 255, 0.14); box-shadow: 0 24px 50px rgba(5, 12, 24, 0.3); }
.co-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--mint); padding: 12px; flex: none; }
.co-ico svg { width: 100%; height: 100%; display: block; }
.co-txt { font-family: var(--font-title); font-weight: 600; font-size: 34px; letter-spacing: -0.025em; color: var(--white); white-space: nowrap; }

/* logo sting */
.sting-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.sting-sym { width: 150px; height: 150px; }
.sting-name { font-family: var(--font-title); font-weight: 600; font-size: 92px; letter-spacing: -0.035em; color: var(--white); line-height: 1; }
.sting-sub { margin-top: 8px; font-family: var(--font-data); font-weight: 500; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mint); }

/* end card */
.end-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 120% 90% at 50% 40%, #1e3149 0%, #15223a 55%, #101a2e 100%); }
.end-glow { position: absolute; left: 50%; top: 42%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; background: radial-gradient(circle, rgba(46, 190, 155, 0.34) 0%, rgba(63, 127, 118, 0.16) 38%, rgba(21, 34, 58, 0) 70%); }
.end-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 var(--m); }
.end-sym { width: var(--end-sym); height: var(--end-sym); }
